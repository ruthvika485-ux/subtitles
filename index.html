<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tamil Subtitles</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}.top{background:#111;padding:12px;text-align:center;font-size:18px;color:#f0c060;font-weight:bold}#status{background:#222;padding:8px;text-align:center;font-size:13px;color:#888}.subs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.sub{background:#111;border-radius:8px;padding:10px}.orig{font-size:12px;color:#555;font-style:italic;margin-bottom:4px}.eng{font-size:17px;color:#f0c060;font-weight:bold}.live{background:#0a0a1a;border-top:1px solid #222;padding:10px 12px;font-size:13px;color:#60a8f0;font-style:italic;min-height:40px}.btn{background:#f0c060;color:#000;border:none;padding:16px;font-size:17px;font-weight:bold;width:100%;cursor:pointer}</style></head><body><div class="top">🎬 Tamil → English Subtitles</div><div id="status">Tap Start to begin</div><div class="subs" id="subs"><div style="text-align:center;color:#444;margin-top:40px;font-size:15px">🎭 Subtitles will appear here</div></div><div class="live" id="live">–</div><button class="btn" id="btn" onclick="toggle()">🎙️ Start Listening</button><script>let r=null,on=false,q=[],busy=false;function toggle(){on?stop():start()}async function start(){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}catch(e){alert('Please allow microphone access!\n\nGo to browser Settings → Site Settings → Microphone → Allow');return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Please use Chrome!');return}r=new SR();r.lang='ta-IN';r.continuous=true;r.interimResults=true;r.onstart=()=>{on=true;document.getElementById('btn').textContent='⏹️ Stop';document.getElementById('status').textContent='🔴 Listening for Tamil...';document.getElementById('status').style.color='#f07060'}r.onresult=e=>{let i='',f='';for(let x=e.resultIndex;x<e.results.length;x++){let t=e.results[x][0].transcript;e.results[x].isFinal?f+=t:i+=t}document.getElementById('live').textContent=i||f||'...';if(f.trim().length>1){q.push(f.trim());run()}}r.onerror=e=>{if(e.error==='not-allowed'){alert('Mic blocked! Allow it in browser settings.');stop()}}r.onend=()=>{if(on)setTimeout(()=>{try{r.start()}catch(e){}},300)}r.start()}function stop(){on=false;r&&r.stop();r=null;document.getElementById('btn').textContent='🎙️ Start Listening';document.getElementById('status').textContent='Stopped';document.getElementById('status').style.color='#888';document.getElementById('live').textContent='–'}async function run(){if(busy||!q.length)return;busy=true;let t=q.shift();document.getElementById('status').textContent='⏳ Translating...';document.getElementById('status').style.color='#60a8f0';try{let res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=ta|en`);let d=await res.json();let eng=d.responseData?.translatedText||'...';add(t,eng)}catch(e){add(t,'(translation failed)')}document.getElementById('status').textContent='🔴 Listening for Tamil...';document.getElementById('status').style.color='#f07060';busy=false;run()}function add(t,e){let s=document.getElementById('subs');let d=document.createElement('div');d.className='sub';d.innerHTML=`<div class="orig">${t}</div><div class="eng">${e}</div>`;s.appendChild(d);s.scrollTop=s.scrollHeight}</script></body></html>
