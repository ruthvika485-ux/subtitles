<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tamil Subtitles</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}.top{background:#111;padding:10px;text-align:center;font-size:16px;color:#f0c060;font-weight:bold;flex-shrink:0}#status{background:#222;padding:6px;text-align:center;font-size:12px;color:#888;flex-shrink:0}.subs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:0}.sub{background:#111;border-radius:8px;padding:10px}.orig{font-size:11px;color:#555;font-style:italic;margin-bottom:3px}.eng{font-size:16px;color:#f0c060;font-weight:bold}.live{background:#0a0a1a;border-top:1px solid #222;padding:8px 12px;font-size:12px;color:#60a8f0;font-style:italic;flex-shrink:0}.btn{background:#f0c060;color:#000;border:none;padding:18px;font-size:18px;font-weight:bold;width:100%;cursor:pointer;flex-shrink:0}</style></head><body><div class="top">Tamil to English Subtitles</div><div id="status">Tap Start to begin</div><div class="subs" id="subs"><p style="text-align:center;color:#333;margin-top:30px">Subtitles will appear here</p></div><div class="live" id="live">-</div><button class="btn" id="btn" onclick="go()">START LISTENING</button><script>var r=null,on=false,q=[],busy=false;function go(){on?stop():start()}function start(){navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){s.getTracks().forEach(function(t){t.stop()});run_sr()}).catch(function(){alert("Allow microphone please")})}function run_sr(){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("Use Chrome");return}r=new SR();r.lang="ta-IN";r.continuous=true;r.interimResults=true;r.onstart=function(){on=true;document.getElementById("btn").textContent="STOP";document.getElementById("status").textContent="Listening..."};r.onresult=function(e){var i="",f="";for(var x=e.resultIndex;x<e.results.length;x++){var t=e.results[x][0].transcript;if(e.results[x].isFinal)f+=t;else i+=t}document.getElementById("live").textContent=i||f||"...";if(f.trim().length>1){q.push(f.trim());translate()}};r.onerror=function(e){if(e.error==="not-allowed")alert("Mic blocked!")};r.onend=function(){if(on)setTimeout(function(){try{r.start()}catch(e){}},300)};r.start()}function stop(){on=false;if(r)r.stop();r=null;document.getElementById("btn").textContent="START LISTENING";document.getElementById("status").textContent="Stopped"}function translate(){if(busy||!q.length)return;busy=true;var t=q.shift();fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(t)+"&langpair=ta|en").then(function(r){return r.json()}).then(function(d){var e=d.responseData.translatedText||"...";add(t,e);busy=false;translate()}).catch(function(){add(t,"failed");busy=false;translate()})}function add(t,e){var s=document.getElementById("subs");var d=document.createElement("div");d.className="sub";d.innerHTML="<div class=orig>"+t+"</div><div class=eng>"+e+"</div>";s.appendChild(d);s.scrollTop=s.scrollHeight}</script></body></html>
